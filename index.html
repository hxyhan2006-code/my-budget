<style>
  :root{
    --paper:#EFEAE0;
    --surface:#F8F4EC;
    --ink:#2A2521;
    --faint:#8C8274;
    --line:#DAD1C0;
    --income:#3F6C51;
    --expense:#8C3B2E;
    --saving:#3A5A6B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    -webkit-tap-highlight-color: transparent;
  }
  .mono{ font-family: 'Courier New', monospace; }
  .page{ max-width:460px; margin:0 auto; padding-bottom:calc(96px + env(safe-area-inset-bottom)); min-height:100vh; position:relative; }
  header{ padding:28px 20px 18px; border-bottom:1px solid var(--line); }
  .header-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
  h1{ font-size:22px; font-weight:600; margin:0; }
  select{
    font-family:inherit; font-size:13px; color:var(--faint);
    background:transparent; border:1px solid var(--line); border-radius:8px; padding:6px 10px;
  }
  .balance-row{ display:flex; flex-direction:column; gap:2px; margin-bottom:14px; }
  .balance-label{ font-size:12px; color:var(--faint); }
  .balance-num{ font-size:40px; font-weight:600; letter-spacing:-0.5px; }
  .pill-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .pill{
    display:flex; align-items:center; gap:5px; font-size:12.5px;
    background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:6px 10px;
  }
  .backup-row{ display:flex; gap:14px; }
  .backup-link{
    font-family:inherit; font-size:12px; color:var(--faint); background:none; border:none;
    cursor:pointer; text-decoration:underline; padding:0;
  }
  .error-banner{ margin:12px 20px 0; font-size:13px; color:var(--expense); background:#F5E7E2; border-radius:8px; padding:8px 12px; display:none; }
  .backup-banner{
    margin:12px 20px 0; font-size:12.5px; color:var(--ink); background:var(--surface);
    border:1px solid var(--line); border-radius:8px; padding:8px 12px; display:none;
    align-items:center; justify-content:space-between; gap:10px;
  }
  .backup-banner.show{ display:flex; }
  .backup-banner button{
    font-family:inherit; font-size:12px; color:var(--ink); background:var(--paper);
    border:1px solid var(--line); border-radius:6px; padding:4px 10px; cursor:pointer; white-space:nowrap;
  }
  .backup-banner .dismiss{ background:none; border:none; color:var(--faint); font-size:14px; padding:0 2px; }
  .search-row{ display:flex; gap:8px; margin:0 0 10px; }
  .search-row input{
    flex:1; font-family:inherit; font-size:13px; border:1px solid var(--line); border-radius:8px;
    padding:7px 10px; background:var(--surface); color:var(--ink);
  }
  .cat-chip-wrap.orphan{ border-style:dashed; }
  .cat-chip-wrap.orphan .cat-chip-label{ color:var(--faint); font-style:italic; }
  .toast{
    position:fixed; bottom:calc(96px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); background:var(--ink); color:#fff;
    font-size:13px; padding:9px 16px; border-radius:20px; opacity:0; transition:opacity .25s; z-index:20; pointer-events:none;
  }
  .toast.show{ opacity:1; }
  .breakdown-section{ padding:18px 20px 6px; display:flex; flex-direction:column; gap:20px; }
  .section-label{ font-size:13px; color:var(--faint); }
  .bar-row{ margin-bottom:10px; }
  .bar-row-top{ display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:4px; }
  .bar-track{ height:6px; background:var(--line); border-radius:4px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:4px; }
  .list-section{ padding:10px 20px 0; }
  .list-header-row{ display:flex; justify-content:space-between; align-items:baseline; margin:8px 0; }
  .empty-state{
    font-size:13.5px; color:var(--faint); text-align:center; padding:28px 10px;
    border:1px dashed var(--line); border-radius:12px;
  }
  ul.list{ list-style:none; margin:0; padding:0; }
  .list-item{
    display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .list-item-left{ display:flex; align-items:center; gap:12px; }
  .list-date{ font-size:12px; color:var(--faint); width:40px; flex-shrink:0; }
  .list-cat{ font-size:14.5px; }
  .list-note{ font-size:12.5px; color:var(--faint); margin-top:1px; }
  .list-item-right{ display:flex; align-items:center; gap:6px; }
  .icon-btn{ background:none; border:none; cursor:pointer; padding:5px; color:var(--faint); font-size:14px; }
  .fab{
    position:fixed; bottom:calc(24px + env(safe-area-inset-bottom)); right:24px;
    width:54px; height:54px; border-radius:50%; background:var(--ink); border:none;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,0.25); font-size:26px; color:#fff;
  }
  .page-anchor{ max-width:460px; margin:0 auto; position:relative; }
  .overlay{
    position:fixed; inset:0; background:rgba(30,26,22,0.4); display:none;
    align-items:flex-end; justify-content:center; z-index:10;
  }
  .overlay.open{ display:flex; }
  .sheet-modal{
    width:100%; max-width:460px; background:var(--paper); border-radius:20px 20px 0 0;
    padding:18px 20px calc(28px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto;
  }
  .modal-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .modal-title{ font-size:17px; font-weight:600; }
  .close-btn{ background:none; border:none; cursor:pointer; font-size:20px; color:var(--faint); }
  .type-toggle{ display:flex; gap:6px; margin-bottom:16px; }
  .type-btn{
    flex:1; padding:10px 4px; border-radius:10px; border:1px solid var(--line);
    background:var(--surface); color:var(--faint); font-family:inherit; font-size:13px; cursor:pointer; white-space:nowrap;
  }
  .type-btn.active-expense{ background:var(--expense); color:#fff; border-color:transparent; }
  .type-btn.active-income{ background:var(--income); color:#fff; border-color:transparent; }
  .type-btn.active-saving{ background:var(--saving); color:#fff; border-color:transparent; }
  label.field-label{ display:block; font-size:12px; color:var(--faint); margin-top:14px; margin-bottom:6px; }
  input#amount{
    width:100%; font-size:28px; font-weight:600; border:none; border-bottom:2px solid var(--line);
    background:transparent; padding:4px 0; outline:none; color:var(--ink); font-family:'Courier New', monospace;
  }
  .cat-grid{ display:flex; flex-wrap:wrap; gap:8px; }
  .cat-chip-wrap{
    display:inline-flex; align-items:center; border:1px solid var(--line); border-radius:20px;
    background:var(--surface); overflow:hidden;
  }
  .cat-chip-wrap.selected-expense{ background:var(--expense); border-color:transparent; }
  .cat-chip-wrap.selected-income{ background:var(--income); border-color:transparent; }
  .cat-chip-wrap.selected-saving{ background:var(--saving); border-color:transparent; }
  .cat-chip-wrap.selected-expense .cat-chip-label,
  .cat-chip-wrap.selected-income .cat-chip-label,
  .cat-chip-wrap.selected-saving .cat-chip-label,
  .cat-chip-wrap.selected-expense .cat-chip-del,
  .cat-chip-wrap.selected-income .cat-chip-del,
  .cat-chip-wrap.selected-saving .cat-chip-del{ color:#fff; }
  .cat-chip-label{
    background:none; border:none; font-family:inherit; font-size:13.5px; cursor:pointer; color:var(--ink);
    padding:8px 4px 8px 14px;
  }
  .cat-chip-del{
    background:none; border:none; font-family:inherit; font-size:13px; cursor:pointer; color:var(--faint);
    padding:8px 12px 8px 4px; opacity:0.7;
  }
  .cat-chip{
    padding:8px 14px; border-radius:20px; border:1px solid var(--line); background:var(--surface);
    font-family:inherit; font-size:13.5px; cursor:pointer; color:var(--ink);
  }
  .cat-chip.add-chip{ border-style:dashed; color:var(--faint); }
  input#date, input#note{
    width:100%; font-family:inherit; font-size:14px; border:1px solid var(--line); border-radius:8px;
    padding:8px 10px; background:var(--surface); color:var(--ink);
  }
  #submitBtn{
    width:100%; margin-top:22px; padding:13px 0; border-radius:12px; border:none; color:#fff;
    font-family:inherit; font-size:15px; font-weight:600; cursor:pointer;
  }
  #submitBtn:disabled{ opacity:0.4; }
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="header-top">
      <h1>บัญชี</h1>
      <select id="monthSelect"></select>
    </div>
    <div class="balance-row">
      <span class="balance-label">คงเหลือเดือนนี้ (เงินสดใช้ได้จริง)</span>
      <span class="balance-num mono" id="balanceNum">฿0</span>
      <span class="mono" id="netWorthNum" style="font-size:12px;color:var(--faint)"></span>
    </div>
    <div class="pill-row">
      <div class="pill"><span style="color:var(--faint)">เข้า</span><span class="mono" style="color:var(--income);font-weight:600" id="pillIncome">฿0</span></div>
      <div class="pill"><span style="color:var(--faint)">ออก</span><span class="mono" style="color:var(--expense);font-weight:600" id="pillExpense">฿0</span></div>
      <div class="pill"><span style="color:var(--faint)">ออม</span><span class="mono" style="color:var(--saving);font-weight:600" id="pillSaving">฿0</span></div>
    </div>
    <div class="backup-row">
      <button class="backup-link" id="exportBtn">สำรองข้อมูล</button>
      <button class="backup-link" id="importBtn">กู้คืนข้อมูล</button>
      <input type="file" id="importFile" accept=".json" style="display:none" />
    </div>
  </header>

  <div class="error-banner" id="errorBanner">บันทึกไม่สำเร็จ ลองใหม่อีกที</div>
  <div class="backup-banner" id="backupBanner">
    <span>ยังไม่ได้สำรองข้อมูลเดือนนี้ กดสำรองไว้กันข้อมูลหายนะ</span>
    <span style="display:flex; gap:6px; align-items:center;">
      <button id="backupNowBtn" type="button">สำรองเลย</button>
      <button class="dismiss" id="backupDismissBtn" type="button" aria-label="ปิด">✕</button>
    </span>
  </div>

  <div class="breakdown-section" id="breakdownSection"></div>

  <div class="list-section">
    <div class="list-header-row">
      <span class="section-label">รายการ</span>
      <select id="typeFilter" style="font-family:inherit; font-size:12px; color:var(--faint); background:transparent; border:1px solid var(--line); border-radius:8px; padding:4px 8px;">
        <option value="all">ทั้งหมด</option>
        <option value="income">เฉพาะรายรับ</option>
        <option value="expense">เฉพาะรายจ่าย</option>
        <option value="saving">เฉพาะออม/ลงทุน</option>
      </select>
      <span style="color:var(--faint); font-size:12px" id="countLabel">0 รายการ</span>
    </div>
    <div class="search-row">
      <input id="searchInput" type="text" placeholder="ค้นหาหมวดหรือโน้ต..." autocomplete="off" />
    </div>
    <div id="listContainer"></div>
  </div>
</div>

<div class="page-anchor">
  <button class="fab" id="fabBtn">+</button>
</div>

<div class="toast" id="toast"></div>

<div class="overlay" id="overlay">
  <div class="sheet-modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">เพิ่มรายการ</span>
      <button class="close-btn" id="closeBtn">✕</button>
    </div>
    <div class="type-toggle" id="typeToggle">
      <button class="type-btn" data-type="expense">รายจ่าย</button>
      <button class="type-btn" data-type="income">รายรับ</button>
      <button class="type-btn" data-type="saving">ออม/ลงทุน</button>
    </div>
    <label class="field-label">จำนวนเงิน (บาท)</label>
    <input id="amount" type="number" inputmode="decimal" step="any" min="0" placeholder="0" autocomplete="off" />
    <label class="field-label">หมวด</label>
    <div class="cat-grid" id="catGrid"></div>
    <label class="field-label">วันที่</label>
    <input id="date" type="date" autocomplete="off" />
    <label class="field-label">โน้ต (ไม่บังคับ)</label>
    <input id="note" type="text" placeholder="เช่น ค่าข้าวเที่ยง" autocomplete="off" />
    <button id="submitBtn">บันทึก</button>
  </div>
</div>
<script>
const THAI_MONTHS_FULL = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
const THAI_MONTHS_SHORT = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];

const DEFAULT_CATS = {
  income: ["กยศ.", "เงินแม่", "ยูทูป", "อื่นๆ"],
  expense: ["กิน", "คาเฟ่", "ค่าหอ (น้ำ/ไฟ)", "ค่าเดินทาง", "ของใช้จำเป็น", "ของชอบ", "เงินหาย/จิปาถะ"],
  saving: ["เงินออม", "ลงทุนหุ้น", "อื่นๆ"],
};

const ENTRIES_KEY = "finance_tracker_entries_v1";
const CATS_KEY = "finance_tracker_categories_v1";
const LAST_CAT_KEY = "finance_tracker_last_cat_v1";
const BACKUP_KEY = "finance_tracker_last_backup_v1";

let entries = [];
let CATS_BY_TYPE = { income: [...DEFAULT_CATS.income], expense: [...DEFAULT_CATS.expense], saving: [...DEFAULT_CATS.saving] };
let lastUsedCat = { income: "", expense: "", saving: "" };
let selectedMonth = "";
let typeFilter = "all";
let searchQuery = "";
let formType = "expense";
let selectedCategory = "";
let orphanCategory = null; // category from an existing entry that no longer exists in CATS_BY_TYPE; kept visible so editing doesn't silently reassign it
let editingId = null;

function makeId(){
  if(window.crypto && typeof crypto.randomUUID === "function") return crypto.randomUUID();
  return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 9);
}
// รวมเงินด้วยหน่วยสตางค์ (integer) ก่อน แล้วค่อยหารคืนเป็นบาท กันปัญหา floating point เพี้ยนสะสม เช่น 0.1+0.2
function toCents(n){ return Math.round(Number(n || 0) * 100); }

function todayISO(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function monthKey(d){ return d.slice(0,7); }
function fmt(n){ return new Intl.NumberFormat("th-TH",{maximumFractionDigits:2}).format(n); }
function monthLabel(mk){
  const [y,m] = mk.split("-").map(Number);
  return `${THAI_MONTHS_FULL[m-1]} ${y+543}`;
}
function dayLabel(iso){
  const [y,m,d] = iso.split("-").map(Number);
  return `${d} ${THAI_MONTHS_SHORT[m-1]}`;
}
function escapeHtml(s){
  const d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => t.classList.remove("show"), 2200);
}

function loadEntries(){
  try{
    const raw = localStorage.getItem(ENTRIES_KEY);
    entries = raw ? JSON.parse(raw) : [];
  }catch(e){ entries = []; }
}
function saveEntries(){
  try{
    const res = localStorage.setItem(ENTRIES_KEY, JSON.stringify(entries));
    document.getElementById("errorBanner").style.display = "none";
    return true;
  }catch(e){
    document.getElementById("errorBanner").style.display = "block";
    return false;
  }
}
function loadCategories(){
  try{
    const raw = localStorage.getItem(CATS_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      CATS_BY_TYPE = {
        income: parsed.income && parsed.income.length ? parsed.income : [...DEFAULT_CATS.income],
        expense: parsed.expense && parsed.expense.length ? parsed.expense : [...DEFAULT_CATS.expense],
        saving: parsed.saving && parsed.saving.length ? parsed.saving : [...DEFAULT_CATS.saving],
      };
    }
  }catch(e){ /* keep defaults */ }
}
function saveCategories(){
  try{ localStorage.setItem(CATS_KEY, JSON.stringify(CATS_BY_TYPE)); }catch(e){}
}
function loadLastCat(){
  try{
    const raw = localStorage.getItem(LAST_CAT_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      lastUsedCat = { income: parsed.income || "", expense: parsed.expense || "", saving: parsed.saving || "" };
    }
  }catch(e){ /* keep defaults */ }
}
function saveLastCat(){
  try{ localStorage.setItem(LAST_CAT_KEY, JSON.stringify(lastUsedCat)); }catch(e){}
}
function getLastBackup(){
  try{ return localStorage.getItem(BACKUP_KEY) || ""; }catch(e){ return ""; }
}
function setLastBackup(iso){
  try{ localStorage.setItem(BACKUP_KEY, iso); }catch(e){}
}
function refreshBackupBanner(){
  const banner = document.getElementById("backupBanner");
  if(!entries.length){ banner.classList.remove("show"); return; }
  const lastBackup = getLastBackup();
  const staleBackup = !lastBackup || monthKey(lastBackup) !== monthKey(todayISO());
  const dismissedThisMonth = sessionStorage.getItem("backupDismissedMonth") === monthKey(todayISO());
  banner.classList.toggle("show", staleBackup && !dismissedThisMonth);
}

function getMonths(){
  const set = new Set(entries.map(e => monthKey(e.date)));
  const now = new Date();
  for(let i=0; i<12; i++){
    const y = now.getFullYear();
    const m = now.getMonth() - i;
    const d2 = new Date(y, m, 1);
    const mk = `${d2.getFullYear()}-${String(d2.getMonth()+1).padStart(2,"0")}`;
    set.add(mk);
  }
  return Array.from(set).sort().reverse();
}
function getMonthEntries(){
  return entries.filter(e => monthKey(e.date) === selectedMonth);
}
function getTotals(){
  const me = getMonthEntries();
  const sumOf = t => me.filter(e => e.type === t).reduce((s,e) => s + toCents(e.amount), 0) / 100;
  const income = sumOf("income"), expense = sumOf("expense"), saving = sumOf("saving");
  return { income, expense, saving, balance: income - expense - saving };
}
function getByCategory(type, totals){
  const cats = CATS_BY_TYPE[type];
  const me = getMonthEntries();
  const totalForType = totals[type];
  return cats.map(cat => ({
    cat,
    amount: me.filter(e => e.type === type && e.category === cat).reduce((s,e) => s + toCents(e.amount), 0) / 100
  })).filter(c => c.amount > 0)
    .sort((a,b) => b.amount - a.amount)
    .map(c => ({ ...c, pct: totalForType ? Math.round((c.amount/totalForType)*100) : 0 }));
}

function render(){
  refreshBackupBanner();
  const months = getMonths();
  const monthSelect = document.getElementById("monthSelect");
  monthSelect.innerHTML = months.map(m => `<option value="${m}" ${m===selectedMonth?"selected":""}>${monthLabel(m)}</option>`).join("");

  const totals = getTotals();
  document.getElementById("balanceNum").textContent = (totals.balance<0?"-":"") + "฿" + fmt(Math.abs(totals.balance));
  document.getElementById("balanceNum").style.color = totals.balance<0 ? "var(--expense)" : "var(--ink)";
  const netWorth = totals.income - totals.expense; // เงินออมยังเป็นของเรา จึงไม่ถูกหักออกจากมูลค่าสุทธิ
  document.getElementById("netWorthNum").textContent =
    "มูลค่าสุทธิ (รวมเงินออม): " + (netWorth<0?"-":"") + "฿" + fmt(Math.abs(netWorth));
  document.getElementById("pillIncome").textContent = "฿"+fmt(totals.income);
  document.getElementById("pillExpense").textContent = "฿"+fmt(totals.expense);
  document.getElementById("pillSaving").textContent = "฿"+fmt(totals.saving);

  const breakdownSection = document.getElementById("breakdownSection");
  const blocks = [
    { key:"income", label:"รายรับตามหมวด", color:"var(--income)" },
    { key:"expense", label:"รายจ่ายตามหมวด", color:"var(--expense)" },
    { key:"saving", label:"ออม/ลงทุนตามหมวด", color:"var(--saving)" },
  ];
  breakdownSection.innerHTML = blocks.map(b => {
    const rows = getByCategory(b.key, totals);
    if(rows.length===0) return "";
    return `<div>
      <span class="section-label">${escapeHtml(b.label)}</span>
      <div style="margin-top:8px">
        ${rows.map(r => `
          <div class="bar-row">
            <div class="bar-row-top"><span>${escapeHtml(r.cat)}</span><span class="mono">฿${fmt(r.amount)}</span></div>
            <div class="bar-track"><div class="bar-fill" style="width:${r.pct}%;background:${b.color}"></div></div>
          </div>
        `).join("")}
      </div>
    </div>`;
  }).join("");

  document.getElementById("typeFilter").value = typeFilter;
  const q = searchQuery.trim().toLowerCase();
  const me = [...getMonthEntries()]
    .filter(e => typeFilter==="all" || e.type===typeFilter)
    .filter(e => !q || e.category.toLowerCase().includes(q) || (e.note || "").toLowerCase().includes(q))
    .sort((a,b) => b.date.localeCompare(a.date));
  document.getElementById("countLabel").textContent = me.length + " รายการ";
  const listContainer = document.getElementById("listContainer");
  if(me.length===0){
    listContainer.innerHTML = `<div class="empty-state">ยังไม่มีรายการในเดือนนี้ — กดปุ่ม + เพื่อเริ่มจด</div>`;
  }else{
    listContainer.innerHTML = `<ul class="list">
      ${me.map(e => {
        const color = e.type==="income" ? "var(--income)" : e.type==="saving" ? "var(--saving)" : "var(--expense)";
        const sign = e.type==="income" ? "+" : e.type==="saving" ? "→" : "−";
        return `<li class="list-item" data-id="${e.id}">
          <div class="list-item-left">
            <span class="list-date">${dayLabel(e.date)}</span>
            <div>
              <div class="list-cat">${escapeHtml(e.category)}</div>
              ${e.note ? `<div class="list-note">${escapeHtml(e.note)}</div>` : ""}
            </div>
          </div>
          <div class="list-item-right">
            <span class="mono" style="font-weight:600;color:${color}">${sign}฿${fmt(e.amount)}</span>
            <button class="icon-btn edit-btn" data-id="${e.id}" aria-label="แก้ไข">✏️</button>
            <button class="icon-btn delete-btn" data-id="${e.id}" aria-label="ลบ">🗑</button>
          </div>
        </li>`;
      }).join("")}
    </ul>`;
    listContainer.querySelectorAll(".delete-btn").forEach(btn => {
      btn.addEventListener("click", (ev) => {
        ev.stopPropagation();
        if(!confirm("ลบรายการนี้ใช่ไหม?")) return;
        entries = entries.filter(e => e.id !== btn.dataset.id);
        saveEntries();
        render();
      });
    });
    listContainer.querySelectorAll(".edit-btn").forEach(btn => {
      btn.addEventListener("click", (ev) => {
        ev.stopPropagation();
        const entry = entries.find(e => e.id === btn.dataset.id);
        if(entry) openForm(entry);
      });
    });
    listContainer.querySelectorAll(".list-item").forEach(li => {
      li.addEventListener("click", () => {
        const entry = entries.find(e => e.id === li.dataset.id);
        if(entry) openForm(entry);
      });
    });
  }
}

function renderCatGrid(){
  const cats = CATS_BY_TYPE[formType];
  const catGrid = document.getElementById("catGrid");
  // ถ้าหมวดเดิมของรายการที่กำลังแก้ไขถูกลบไปแล้ว ให้แสดงเป็นชิปชั่วคราว (orphan) แทนการเปลี่ยนหมวดให้เงียบๆ
  const showOrphan = orphanCategory && !cats.includes(orphanCategory);
  const chips = showOrphan ? [{ name: orphanCategory, orphan: true }, ...cats.map(c => ({ name: c, orphan: false }))]
                            : cats.map(c => ({ name: c, orphan: false }));
  catGrid.innerHTML = chips.map(({ name: c, orphan }) => {
    const sel = selectedCategory===c ? "selected-"+formType : "";
    const delBtn = orphan
      ? ""
      : `<button type="button" class="cat-chip-del" data-cat="${escapeHtml(c)}" aria-label="ลบหมวด ${escapeHtml(c)}">×</button>`;
    const label = orphan ? `${escapeHtml(c)} (หมวดถูกลบ)` : escapeHtml(c);
    return `<span class="cat-chip-wrap ${sel} ${orphan?"orphan":""}">
      <button type="button" class="cat-chip-label" data-cat="${escapeHtml(c)}">${label}</button>
      ${delBtn}
    </span>`;
  }).join("") + `<button type="button" class="cat-chip add-chip" id="addCatBtn">+ เพิ่มหมวด</button>`;

  catGrid.querySelectorAll(".cat-chip-label").forEach(btn => {
    btn.addEventListener("click", () => {
      selectedCategory = btn.dataset.cat;
      // เลือกหมวดจริงแล้ว ไม่ต้องเตือนเรื่องหมวดที่ถูกลบอีก
      if(cats.includes(selectedCategory)) orphanCategory = null;
      renderCatGrid();
    });
  });
  catGrid.querySelectorAll(".cat-chip-del").forEach(btn => {
    btn.addEventListener("click", (ev) => {
      ev.stopPropagation();
      const cat = btn.dataset.cat;
      if(CATS_BY_TYPE[formType].length <= 1){
        showToast("ต้องเหลืออย่างน้อย 1 หมวด");
        return;
      }
      const inUse = entries.some(e => e.type===formType && e.category===cat);
      const msg = inUse
        ? `หมวด "${cat}" มีรายการที่บันทึกไว้อยู่ ลบหมวดนี้ออกจากตัวเลือกใช่ไหม? (รายการเดิมจะไม่หาย)`
        : `ลบหมวด "${cat}" ใช่ไหม?`;
      if(!confirm(msg)) return;
      CATS_BY_TYPE[formType] = CATS_BY_TYPE[formType].filter(x => x !== cat);
      saveCategories();
      if(selectedCategory === cat){
        orphanCategory = null;
        selectedCategory = CATS_BY_TYPE[formType][0] || "";
      }
      renderCatGrid();
    });
  });
  document.getElementById("addCatBtn").addEventListener("click", () => {
    const name = prompt("ชื่อหมวดใหม่:");
    if(!name) return;
    const trimmed = name.trim();
    if(!trimmed) return;
    orphanCategory = null;
    if(CATS_BY_TYPE[formType].includes(trimmed)){
      selectedCategory = trimmed;
      renderCatGrid();
      return;
    }
    CATS_BY_TYPE[formType].push(trimmed);
    saveCategories();
    selectedCategory = trimmed;
    renderCatGrid();
  });
}

function setFormType(t, isInit){
  formType = t;
  const cats = CATS_BY_TYPE[t] || [];
  if(!cats.includes(selectedCategory)){
    if(isInit && selectedCategory){
      // กำลังเปิดฟอร์มแก้ไขรายการเดิม และหมวดของรายการนั้นถูกลบไปแล้ว — คงค่าไว้เป็น orphan แทนการสลับเงียบๆ
      orphanCategory = selectedCategory;
    }else{
      // รายการใหม่ หรือผู้ใช้กดสลับประเภทเอง — เลือกหมวดล่าสุดที่เคยใช้กับประเภทนี้ ถ้ามี ไม่งั้นเลือกหมวดแรก
      orphanCategory = null;
      const last = lastUsedCat[t];
      selectedCategory = (last && cats.includes(last)) ? last : (cats.length ? cats[0] : "");
    }
  }else{
    orphanCategory = null;
  }
  document.querySelectorAll(".type-btn").forEach(b => {
    b.classList.remove("active-expense","active-income","active-saving");
    if(b.dataset.type===t) b.classList.add("active-"+t);
  });
  document.getElementById("submitBtn").style.background = `var(--${t})`;
  renderCatGrid();
}

function openForm(entry){
  editingId = entry ? entry.id : null;
  document.getElementById("modalTitle").textContent = entry ? "แก้ไขรายการ" : "เพิ่มรายการ";
  document.getElementById("overlay").classList.add("open");
  document.getElementById("date").value = entry ? entry.date : todayISO();
  document.getElementById("amount").value = entry ? entry.amount : "";
  document.getElementById("note").value = entry ? (entry.note || "") : "";
  selectedCategory = entry ? entry.category : "";
  orphanCategory = null;
  setFormType(entry ? entry.type : "expense", true);
  const v = parseFloat(document.getElementById("amount").value);
  document.getElementById("submitBtn").disabled = !v || v<=0;
  document.getElementById("amount").focus();
}
function closeForm(){
  document.getElementById("overlay").classList.remove("open");
  editingId = null;
}

document.getElementById("fabBtn").addEventListener("click", () => openForm(null));
document.getElementById("closeBtn").addEventListener("click", closeForm);
document.getElementById("overlay").addEventListener("click", closeForm);
document.querySelectorAll(".type-btn").forEach(btn => {
  btn.addEventListener("click", () => setFormType(btn.dataset.type));
});
document.getElementById("amount").addEventListener("input", () => {
  const v = parseFloat(document.getElementById("amount").value);
  document.getElementById("submitBtn").disabled = !v || v<=0;
});
document.getElementById("monthSelect").addEventListener("change", (e) => {
  selectedMonth = e.target.value;
  render();
});
document.getElementById("typeFilter").addEventListener("change", (e) => {
  typeFilter = e.target.value;
  render();
});
document.getElementById("submitBtn").addEventListener("click", () => {
  let amount = parseFloat(document.getElementById("amount").value);
  if(!amount || amount<=0) return;
  amount = Math.round(amount * 100) / 100; // ตัดเศษทศนิยมเกิน 2 ตำแหน่ง กันสตางค์เพี้ยนจาก floating point
  const date = document.getElementById("date").value || todayISO();
  const note = document.getElementById("note").value.trim();

  if(editingId){
    const idx = entries.findIndex(e => e.id === editingId);
    if(idx !== -1){
      entries[idx] = { ...entries[idx], type: formType, category: selectedCategory, amount, date, note };
    }
  }else{
    entries.unshift({ id: makeId(), type: formType, category: selectedCategory, amount, date, note });
  }
  lastUsedCat[formType] = selectedCategory;
  saveLastCat();
  saveEntries();
  closeForm();
  selectedMonth = monthKey(date);
  render();
});

document.getElementById("searchInput").addEventListener("input", (e) => {
  searchQuery = e.target.value;
  render();
});
document.getElementById("backupNowBtn").addEventListener("click", () => {
  document.getElementById("exportBtn").click();
});
document.getElementById("backupDismissBtn").addEventListener("click", () => {
  sessionStorage.setItem("backupDismissedMonth", monthKey(todayISO()));
  document.getElementById("backupBanner").classList.remove("show");
});

document.getElementById("exportBtn").addEventListener("click", () => {
  const payload = { entries, categories: CATS_BY_TYPE, exportedAt: todayISO() };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `finance-backup-${todayISO()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  setLastBackup(todayISO());
  refreshBackupBanner();
  showToast("ดาวน์โหลดไฟล์สำรองแล้ว");
});

document.getElementById("importBtn").addEventListener("click", () => {
  document.getElementById("importFile").click();
});
document.getElementById("importFile").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!data || !Array.isArray(data.entries)) throw new Error("invalid");
      const existingIds = new Set(entries.map(en => en.id));
      const merged = [...entries];
      data.entries.forEach(en => { if(!existingIds.has(en.id)) merged.push(en); });
      entries = merged;
      if(data.categories){
        ["income","expense","saving"].forEach(t => {
          if(Array.isArray(data.categories[t])){
            const set = new Set([...CATS_BY_TYPE[t], ...data.categories[t]]);
            CATS_BY_TYPE[t] = Array.from(set);
          }
        });
        saveCategories();
      }
      saveEntries();
      render();
      showToast("กู้คืนข้อมูลสำเร็จ");
    }catch(err){
      showToast("ไฟล์ไม่ถูกต้อง กู้คืนไม่สำเร็จ");
    }
    e.target.value = "";
  };
  reader.readAsText(file);
});

loadEntries();
loadCategories();
loadLastCat();
selectedMonth = monthKey(todayISO());
render();
</script>
</body>
</html>
